<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Tonight's Reserved</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <!-- AUTH -->
  <section class="screen active" id="auth">
    <div class="scroll">
      <img class="logo-full" src="logo.png" alt="Tonight's Reserved">
      <div class="toggle" id="roleToggle">
        <div class="on" data-role="business">I'm a business</div>
        <div data-role="marketer">I'm a marketer</div>
      </div>
      <div id="authForm"></div>
      <div class="err" id="authErr"></div>
      <button class="btn" id="authSubmit">Continue</button>
      <div class="center sub" style="margin-top:14px" id="authSwitch"></div>
    </div>
  </section>

  <!-- BROWSE -->
  <section class="screen" id="browse">
    <div class="appbar">
      <div><div class="sub" style="font-size:11px" id="greet">Welcome 👋</div>
        <img class="wordmark" src="wordmark.png" alt="Tonight's Reserved"></div>
      <div class="grow"></div>
      <div class="av-btn" id="browseAvatar" onclick="TR.go('account')">B</div>
    </div>
    <div class="scroll">
      <h2 class="title">Find your<br>marketing pro</h2>
      <div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7c7768" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
        <input id="searchInput" placeholder="Search services or specialists…"></div>
      <div class="chips" id="cats"></div>
      <div class="sec-head"><h3>✦ Verified marketers</h3></div>
      <div id="mlist"></div>
    </div>
    <div class="tabbar" id="tabbarBuy"></div>
  </section>

  <!-- PROFILE -->
  <section class="screen" id="profile">
    <div class="appbar"><div class="back" onclick="TR.go('browse')">‹</div>
      <div class="brand-txt">Profile</div></div>
    <div class="scroll" id="profileBody"></div>
  </section>

  <!-- CHECKOUT -->
  <section class="screen" id="checkout">
    <div class="appbar"><div class="back" onclick="TR.back()">‹</div>
      <div class="brand-txt">Confirm booking</div></div>
    <div class="scroll" id="checkoutBody"></div>
  </section>

  <!-- DASHBOARD (marketer) -->
  <section class="screen" id="dash">
    <div class="appbar">
      <div><div class="sub" style="font-size:11px">Marketer dashboard</div>
        <div class="brand-txt" id="dashName">—</div></div>
      <div class="grow"></div>
      <span class="verified" id="dashBadge">✦ Verified</span>
    </div>
    <div class="scroll" id="dashBody"></div>
    <div class="tabbar" id="tabbarSell"></div>
  </section>

  <!-- BOOKINGS -->
  <section class="screen" id="bookings">
    <div class="appbar"><div class="back" onclick="TR.go(TR.state.role==='marketer'?'dash':'browse')">‹</div>
      <div class="brand-txt">Bookings</div></div>
    <div class="scroll" id="bookingsBody"></div>
  </section>

  <!-- ACCOUNT -->
  <section class="screen" id="account">
    <div class="appbar"><div class="back" onclick="TR.go(TR.state.role==='marketer'?'dash':'browse')">‹</div>
      <div class="brand-txt">Account</div></div>
    <div class="scroll" id="accountBody"></div>
  </section>

  <!-- MARKETER APPLICATION -->
  <section class="screen" id="application">
    <div class="appbar"><div class="brand-txt">Become a Verified Marketer</div><div class="grow"></div>
      <div class="av-btn" onclick="TR.logout()" title="Log out">⎋</div></div>
    <div class="scroll" id="applicationBody"></div>
  </section>

  <!-- ADMIN -->
  <section class="screen" id="admin">
    <div class="appbar"><div><div class="sub" style="font-size:11px">Admin · Tonight's Reserved</div>
      <div class="brand-txt">Applications</div></div><div class="grow"></div>
      <div class="av-btn" onclick="TR.logout()" title="Log out">⎋</div></div>
    <div class="scroll" id="adminBody"></div>
  </section>

</div>

<div class="modal" id="modal"><div class="sheet" id="modalSheet"></div></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
