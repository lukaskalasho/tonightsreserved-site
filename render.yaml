# One-file deploy config for Render (https://render.com).
# On Render: New + → Blueprint → connect this repo → it reads this file.
services:
  - type: web
    name: tonights-reserved
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Set these in the Render dashboard when ready (do NOT hardcode secrets here):
      # - key: BASE_URL          -> https://app.tonightsreserved.com
      # - key: STRIPE_SECRET_KEY -> your Stripe key (sk_test_… then sk_live_…)
      # - key: PLATFORM_FEE_PCT  -> 0.20
